name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: docker run -d --name sofinder-minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin minio/minio:latest server /data
      - run: for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:9000/minio/health/ready && exit 0; sleep 1; done; exit 1
      - run: vendor/bin/phpunit
        env:
          SOFINDER_S3_ENDPOINT: http://127.0.0.1:9000
          SOFINDER_S3_BUCKET: sofinder-test
          SOFINDER_S3_ACCESS_KEY: minioadmin
          SOFINDER_S3_SECRET_KEY: minioadmin
